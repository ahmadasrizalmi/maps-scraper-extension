<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --green: #34A853;
      --green-dark: #2D8E47;
      --green-light: #E8F5E9;
      --blue: #007AFF;
      --red: #EA4335;
      --orange: #FB8C00;
      --gray-50: #F9FAFB;
      --gray-100: #F2F2F7;
      --gray-200: #E8E8ED;
      --gray-300: #C6C6C8;
      --gray-500: #86868B;
      --gray-700: #48484A;
      --gray-900: #1D1D1F;
      --radius: 10px;
      --radius-sm: 8px;
    }
    
    body { 
      width: 100%;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      background: var(--gray-100); 
      color: var(--gray-900);
      -webkit-font-smoothing: antialiased;
      font-size: 13px;
    }
    
    /* ─── Header ─────────────────────────────────────────────── */
    
    .header { 
      background: white;
      padding: 14px 16px;
      border-bottom: 0.5px solid var(--gray-300);
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon-box {
      width: 34px;
      height: 34px;
      background: var(--green);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .header-title { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: var(--green-light);
      color: var(--green);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .header-badge svg { width: 13px; height: 13px; }
    
    /* ─── Controls ───────────────────────────────────────────── */
    
    .controls {
      background: white;
      padding: 12px 16px;
      border-bottom: 0.5px solid var(--gray-300);
    }
    
    .scrape-btn {
      width: 100%;
      padding: 12px;
      background: var(--green);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s;
      margin-bottom: 10px;
    }
    .scrape-btn:hover { background: var(--green-dark); }
    .scrape-btn:active { transform: scale(0.98); }
    .scrape-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .scrape-btn svg { width: 18px; height: 18px; }
    
    .scrape-btn.running {
      background: var(--orange);
    }
    
    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 12px;
    }
    .opt {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--gray-700);
      cursor: pointer;
      padding: 4px 0;
    }
    .opt input { accent-color: var(--green); cursor: pointer; }
    
    /* ─── Stats ──────────────────────────────────────────────── */
    
    .stats {
      display: none;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--gray-200);
    }
    .stats.visible { display: grid; }
    .stat-card {
      background: white;
      padding: 10px 6px;
      text-align: center;
    }
    .stat-value { font-size: 18px; font-weight: 700; color: var(--green); }
    .stat-label { font-size: 10px; color: var(--gray-500); text-transform: uppercase; }
    
    /* ─── Progress ───────────────────────────────────────────── */
    
    .progress {
      display: none;
      padding: 10px 16px;
      background: #FFFDE7;
      border-bottom: 0.5px solid #FFF9C4;
    }
    .progress.visible { display: block; }
    .progress-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .progress-text { font-size: 12px; color: var(--orange); font-weight: 500; }
    .progress-eta { font-size: 11px; color: var(--gray-500); }
    .progress-bar { height: 4px; background: #FFF9C4; border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--orange); border-radius: 2px; transition: width 0.3s; width: 0%; }
    
    /* ─── Filter ─────────────────────────────────────────────── */
    
    .filter-bar {
      display: none;
      padding: 10px 16px;
      background: white;
      border-bottom: 0.5px solid var(--gray-300);
      gap: 8px;
    }
    .filter-bar.visible { display: flex; flex-wrap: wrap; }
    
    .search-wrap {
      flex: 1;
      min-width: 100px;
      position: relative;
    }
    .search-wrap svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      color: var(--gray-500);
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 7px 10px 7px 30px;
      background: var(--gray-100);
      border: none;
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: var(--gray-900);
    }
    .search-input:focus { outline: none; background: var(--gray-200); }
    
    .filter-select {
      padding: 7px 8px;
      background: var(--gray-100);
      border: none;
      border-radius: var(--radius-sm);
      font-size: 12px;
      cursor: pointer;
    }
    
    /* ─── Table ──────────────────────────────────────────────── */
    
    .results-container { flex: 1; overflow-y: auto; max-height: calc(100vh - 340px); }
    
    .table-wrap { overflow-x: auto; }
    
    .results-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      white-space: nowrap;
    }
    .results-table th {
      position: sticky;
      top: 0;
      background: var(--gray-100);
      padding: 7px 8px;
      text-align: left;
      font-weight: 600;
      color: var(--gray-500);
      font-size: 10px;
      text-transform: uppercase;
      border-bottom: 0.5px solid var(--gray-300);
      z-index: 2;
      cursor: pointer;
      user-select: none;
    }
    .results-table th:hover { color: var(--gray-900); }
    .results-table td {
      padding: 7px 8px;
      border-bottom: 0.5px solid var(--gray-200);
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .results-table tr:hover td { background: var(--gray-50); }
    
    .cell-name { font-weight: 600; }
    .cell-rating { color: var(--orange); font-weight: 600; }
    .cell-phone a { color: var(--blue); text-decoration: none; }
    .cell-phone a:hover { text-decoration: underline; }
    .cell-website a { color: var(--green); text-decoration: none; }
    .cell-email a { color: var(--red); text-decoration: none; font-size: 10px; }
    
    .empty-state { text-align: center; padding: 48px 24px; color: var(--gray-500); }
    .empty-state svg { width: 48px; height: 48px; color: var(--gray-300); margin-bottom: 12px; }
    .empty-title { font-size: 16px; font-weight: 600; color: var(--gray-900); margin-bottom: 4px; }
    .empty-text { font-size: 12px; max-width: 240px; margin: 0 auto; }
    
    /* ─── Footer ─────────────────────────────────────────────── */
    
    .footer {
      position: sticky;
      bottom: 0;
      background: white;
      padding: 10px 16px;
      border-top: 0.5px solid var(--gray-300);
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn { 
      padding: 8px 10px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn svg { width: 14px; height: 14px; }
    
    .btn-green { background: var(--green); color: white; }
    .btn-green:hover:not(:disabled) { background: var(--green-dark); }
    .btn-blue { background: var(--blue); color: white; }
    .btn-gray { background: var(--gray-100); color: var(--gray-900); }
    .btn-gray:hover:not(:disabled) { background: var(--gray-200); }
    
    .not-maps { display: none; text-align: center; padding: 48px 24px; }
    .not-maps.visible { display: block; }
    .not-maps svg { width: 56px; height: 56px; color: var(--gray-300); margin-bottom: 16px; }
    .not-maps h2 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
    .not-maps p { font-size: 12px; color: var(--gray-500); margin-bottom: 16px; }
    
    .toast {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--gray-900);
      color: white;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s;
      z-index: 100;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 3px; }
  </style>
</head>
<body>
  
  <!-- Header -->
  <div class="header">
    <div class="header-brand">
      <div class="header-icon-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      </div>
      <div class="header-title">Maps Lead Scraper</div>
    </div>
    <div class="header-badge" id="lead-count">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span id="lead-count-text">0</span>
    </div>
  </div>
  
  <!-- Controls -->
  <div class="controls">
    <button class="scrape-btn" id="btn-scrape">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <span id="btn-scrape-text">Scrape Listings</span>
    </button>
    <div class="options">
      <label class="opt">
        <input type="checkbox" id="opt-scroll" checked>
        <span>Auto-scroll</span>
      </label>
      <label class="opt">
        <input type="checkbox" id="opt-details" checked>
        <span>Get details</span>
      </label>
      <label class="opt">
        <input type="checkbox" id="opt-emails">
        <span>Extract emails</span>
      </label>
      <label class="opt">
        <input type="checkbox" id="opt-dedup" checked>
        <span>Deduplicate</span>
      </label>
    </div>
  </div>
  
  <!-- Stats -->
  <div class="stats" id="stats">
    <div class="stat-card">
      <div class="stat-value" id="stat-total">0</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-phone">0</div>
      <div class="stat-label">Phone</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-website">0</div>
      <div class="stat-label">Website</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-email">0</div>
      <div class="stat-label">Email</div>
    </div>
  </div>
  
  <!-- Progress -->
  <div class="progress" id="progress">
    <div class="progress-header">
      <span class="progress-text" id="progress-text">Scraping...</span>
      <span class="progress-eta" id="progress-eta"></span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>
  
  <!-- Filter -->
  <div class="filter-bar" id="filter-bar">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" class="search-input" id="search-input" placeholder="Search...">
    </div>
    <select class="filter-select" id="filter-rating">
      <option value="">All ratings</option>
      <option value="4.5">4.5+</option>
      <option value="4.0">4.0+</option>
      <option value="3.5">3.5+</option>
    </select>
    <select class="filter-select" id="filter-has">
      <option value="">All</option>
      <option value="phone">Has phone</option>
      <option value="website">Has website</option>
      <option value="email">Has email</option>
    </select>
  </div>
  
  <!-- Results -->
  <div class="results-container" id="results-container">
    <div class="empty-state" id="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      <div class="empty-title">Google Maps Lead Scraper</div>
      <div class="empty-text">Search on Google Maps, then click Scrape to extract business leads</div>
    </div>
    <div class="table-wrap" id="table-wrap" style="display:none;">
      <table class="results-table">
        <thead>
          <tr>
            <th data-sort="index">#</th>
            <th data-sort="name">Name</th>
            <th data-sort="category">Category</th>
            <th data-sort="rating">Rating</th>
            <th data-sort="phone">Phone</th>
            <th data-sort="website">Web</th>
            <th data-sort="email">Email</th>
          </tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
    </div>
  </div>
  
  <!-- Not Maps -->
  <div class="not-maps" id="not-maps">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
    <h2>Open Google Maps</h2>
    <p>Navigate to Google Maps and search for businesses.</p>
    <button class="btn btn-green" id="btn-open-maps">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      Open Maps
    </button>
  </div>
  
  <!-- Footer -->
  <div class="footer">
    <button class="btn btn-gray" id="btn-save" disabled>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Save
    </button>
    <button class="btn btn-gray" id="btn-load">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Load
    </button>
    <button class="btn btn-green" id="btn-csv" disabled>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
      CSV
    </button>
    <button class="btn btn-blue" id="btn-xlsx" disabled>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></svg>
      Excel
    </button>
    <button class="btn btn-gray" id="btn-sheets" disabled>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
      Sheets
    </button>
  </div>
  
  <div class="toast" id="toast"></div>
  
  <script src="sidepanel.js"></script>
</body>
</html>
